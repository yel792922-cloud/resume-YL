[project]
name = "financial-report-analyzer"
version = "0.2.0"
description = "Stock-research-focused financial report analysis engine with source traceability"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",     # EmailStr validation
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
    "reportlab>=4.0",            # used only to generate the built-in sample PDF
    "bcrypt>=4.1",              # password hashing
    "PyJWT>=2.8",              # access tokens
]

[project.optional-dependencies]
# OCR for scanned PDFs is optional; the app degrades gracefully without it.
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "Pillow>=10.0",
]
# PostgreSQL driver for production (Render). Local dev defaults to SQLite.
postgres = [
    "psycopg[binary]>=3.1",
]
# Optional PDF preprocessing/compression for large image-heavy uploads.
preprocess = [
    "pikepdf>=8.0",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
