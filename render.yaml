# Render blueprint for the Financial Report Analyzer backend (v0.2.0).
# Uses a Docker image so the OCR toolchain (Tesseract + English/Simplified
# Chinese language packs + Poppler) is available for scanned PDFs. Provisions a
# free Postgres instance; the frontend deploys separately on Vercel.
services:
  - type: web
    name: resume-yl
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-yl-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      # OCR (optional; the image includes the toolchain). Set to false to
      # disable OCR and rely on digital-PDF parsing only.
      - key: FRA_ENABLE_OCR
        value: "true"
      - key: FRA_OCR_LANGUAGES
        value: "chi_sim+eng"
      # Conservative DPI for the 512 MB free tier (raise for accuracy on a
      # larger instance). Keep uploads modest so OCR stays within memory.
      - key: FRA_OCR_DPI
        value: "150"
      - key: FRA_MAX_UPLOADS_PER_USER
        value: "10"
      - key: FRA_MAX_UPLOAD_MB
        value: "15"

databases:
  - name: resume-yl-db
    plan: free
